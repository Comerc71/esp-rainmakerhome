name: Build Yassena Home APK

# Builds an installable APK of the global flavor without any repo secrets.
# Run it from the Actions tab ("Run workflow") or by pushing to main;
# the APK is attached to the run as the "yassena-home-apk" artifact.

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Uses the committed .env.global.example (public RainMaker backend) and the
      # placeholder google-services.json template, so push notifications are off.
      - name: Prebuild global (sync env to Android)
        run: npm run prebuild:android:global

      # No release keystore is configured, so sign with the committed debug
      # keystore: enough for sideloading, not for Play Store publishing.
      - name: Configure signing
        run: |
          cat > android/keystore.properties <<'EOF'
          storeFile=debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # On failure, the Gradle error report is re-emitted as ::error:: annotations
      # so it can be read from the check run without downloading the full log.
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          set -o pipefail
          ./gradlew assembleGlobalRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -x lint -x test \
            --no-daemon \
            --console=plain 2>&1 | tee ../gradle-build.log || {
            # GitHub keeps at most 10 annotations per step, so send one per block.
            report=$(awk '/What went wrong/{p=1} /\* Try:/{p=0} p' ../gradle-build.log | head -60)
            echo "::error title=Gradle::$(printf '%s' "$report" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            compile=$(grep -E "^e: |error:|FAILED" ../gradle-build.log | head -30)
            echo "::error title=Compile::$(printf '%s' "$compile" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - name: Copy APK
        run: cp android/app/build/outputs/apk/global/release/app-global-release.apk yassena-home.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yassena-home-apk
          path: yassena-home.apk
